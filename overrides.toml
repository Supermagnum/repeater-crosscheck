# Local / operator-known facts. Not uploaded to OSM.
# Each [callsign] table may set lat, lon, qth, portable, qrt, url, note, osm_id, skip_osm.
# osm_id (node/…, way/…, or OSM URL) merges review tags onto that existing object.
# skip_osm = true ignores OSM callsign/QTH matches (use when OSM tags are wrong).
# skip = true omits the callsign from CSV/JOSM outputs.
# detach_osm = true with osm_id: strip amateur tags from that object and emit the
# callsign as a co-located synthetic node (one feature per repeater).
# Callsigns with an APRS/D-STAR SSID (e.g. [LA2L-10], [LA7RRA-B]) keep that SSID.
# Override-only entries (not in NRRL) with lat/lon or type/tx are still emitted.
#
# [scrub_osm] ids = [ "node/…", "way/…" ] — emit those objects infrastructure-only.

[scrub_osm]
ids = [
  "node/2641537344",  # Bagn hovedsender — detach wrong LA5MR tags
  "node/5576656903",  # Trysilfjellet — detach LA5TRR (and LD2GO)
  "node/5576656416",  # Trysilfjellet neighbour mast — also had LA5TRR tags
]

