# Copy to config.toml and edit. Do not commit secrets.

[paths]
nrrl_csv = "/home/haaken/anytone/export/Relestasjoner.csv"
channel_csv = "/home/haaken/anytone/export/channel.csv"
zone_csv = "/home/haaken/anytone/export/zone.csv"
overrides = "./overrides.toml"
cache_dir = "./cache"
output_dir = "./output"
# Local RepeaterBook Norway JSON (exportROW / CHIRP rb-norway-all.json).
# Used when [repeaterbook].api_token is empty so pins replace Maidenhead centres.
repeaterbook_json = "./data/repeaterbook_norway.json"

[thresholds]
# Flag when any two source positions disagree by more than this (metres).
disagreement_m = 2000
# radioid / RepeaterBook counts as "near" the locator square within this margin.
locator_near_m = 500
# Frequency match tolerance (MHz) when falling back from callsign matching.
freq_tolerance_mhz = 0.001
# Max distance (m) for frequency+distance fallback matching.
freq_match_max_m = 5000
# Fuzzy QTH vs OSM name match threshold (0-100, rapidfuzz.ratio).
qth_fuzzy_min = 80

[http]
# REQUIRED: put a reachable contact address in the User-Agent.
user_agent = "repeater-crosscheck/1.0 (+https://localhost; you@example.com)"
# Minimum seconds between requests to the same host.
min_interval_s = 1.5
# Overpass can be slow; allow a longer gap after each query.
overpass_min_interval_s = 5.0
timeout_s = 120
retries = 3

[radioid]
# Optional; recommended for future-proofing. Leave empty if unused.
api_token = ""
base_url = "https://radioid.net"
# Query country value used by radioid (try "Norway").
country = "Norway"

[repeaterbook]
# Prefer an rbuapp_ token from API Applications for App #114
# (RepeaterBook Python Client). Leave empty to use paths.repeaterbook_json.
api_token = ""
base_url = "https://www.repeaterbook.com"
country = "Norway"
# App #114 binds the token to this User-Agent literally — do not change it.
# Falls back to [http].user_agent when empty (that will 403 with an App #114 token).
user_agent = "RepeaterBook Python Client/0.6.0 (+micael@jarniac.dev)"

[overpass]
endpoint = "https://overpass-api.de/api/interpreter"
# Norway mainland + Svalbard / Jan Mayen rough bbox (south,west,north,east).
bbox = [57.5, 4.0, 81.0, 35.0]

[mapterhorn]
# Ground elevation in metres ASL for repeaters_merged.csv (Mapterhorn Terrarium).
# Useful as site altitude input for RF path tools such as SPLAT!
# https://github.com/hoche/splat
enabled = true
zoom = 14
tile_url = "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"

[htcommander]
# Write CHIRP CSV + VR-N76 regions JSON under output/htcommander/.
# Can also be enabled with --htcommander / --htcommander-only.
enabled = false

